name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Keep going on the other interpreters so one failure does not hide the rest.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Unit tests read .gitmodules and the git index, not submodule
          # working trees, so the data/ submodules are not needed here.
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # pyproject.toml is gitignored, so the runner regenerates it with the same
      # tool that local dev and Codespaces use: one definition of the dependency
      # set, and the generator's --check mode guards against drift.
      - name: Generate pyproject.toml from requirements.txt
        env:
          # Pin the interpreter uv selects, so the venv matches the matrix entry.
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          python tools/gen_pyproject.py
          python tools/gen_pyproject.py --check

      # `uv sync` creates a project venv for the pinned interpreter. Installing
      # into the system prefix is not an option: Ubuntu runners are PEP 668
      # "externally managed" and reject `pip install` outside a venv.
      - name: Create environment and install the package
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          uv sync
          uv pip install pytest ruff

      - name: Verify interpreter
        run: uv run python --version

      - name: Lint with ruff
        run: uv run ruff check src tests tools

      - name: Check formatting
        run: uv run ruff format --check src tests tools

      - name: Run tests
        run: uv run python -m pytest tests -q
